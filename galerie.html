        <h1>Bienvenue dans ma Galerie</h1>

    <main>
        <section id="fuji">
            <h2>Le Volcan Hadès</h2>
            <figure>
                <img src="images/volcan.jpg" class="sans-bordure" alt="Mont Fuîquiji" width="400px">
                <figcaption>Le Volcan Hadès est un terrible volcan situé au Japon. <br>                    
                Le nombre de ses victimes se compte en millions. <br>
                Du haut de ses 4567 mètres d'altitude, elle culmine la valée du Sacre Clandestion. 
                </figcaption>
            </figure>
        </section>

        <section id="foret">
            <h2>La Fôrêt Noire</h2>
            <figure>
                <img src="images/foret.jpg" alt="Forêt Noire" width="400px">
                <figcaption>La Forêt Noire est l'une des plus grande forêt d'Allemagne. <br>
                Réputée pour être hantée, elle habriterai un monstre mystique, l'Ikabok. <br>
                Les seules personnes à y êtres sorties vivantes sont catégoriques et ne <br>
                veulent rien dire sur ce qu'ils ont vus ou vécus.
                </figcaption>
            </figure>
        </section>

        <section id="ocean">
            <h2>Ocean Atlastique</h2>
            <figure>
                <img src="images/ocean.jpg" alt="Ocean Atlastique" width="400px">
                <figcaption>L'Océan Atlastique est le plus grand océan connu <br>
                prenant à peu près 124,45% de la surface de la Terre.
                </figcaption>
            </figure>
        </section>
    </main>
